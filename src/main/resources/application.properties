spring.application.name=books

# Banco de dados H2 em memória (os dados são perdidos ao reiniciar a aplicação)
spring.datasource.url=jdbc:h2:mem:gamelogdb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# As entidades são convertidas em DTO dentro dos services, então a sessão não precisa ficar aberta na view
spring.jpa.open-in-view=false

# Console visual do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
